plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

// ---------------------------------------------------------------------------
// Project Radio is compiled against as a local, compile-only jar and is never bundled:
// the copy in your mods folder is what loads at runtime. Put project_radio-1.5.jar in
// libs/ (or pass -Pproject_radio_jar=path). A jar only counts if it really contains
// the class this mod hooks; a file merely named project_radio-*.jar proves nothing.
// ---------------------------------------------------------------------------
def PR_MARKER = 'be/n2styles/project_radio/RadioNetworkHandler.class'

boolean jarHasClass(java.io.File f, String entry) {
    if (f == null || !f.isFile()) return false
    try {
        def zf = new java.util.zip.ZipFile(f)
        try {
            return zf.getEntry(entry) != null
        } finally {
            zf.close()
        }
    } catch (Exception ignored) {
        return false
    }
}

java.io.File findProjectRadioJar(org.gradle.api.Project p, String marker) {
    def home = System.getProperty('user.home')
    def candidates = new LinkedHashSet<java.io.File>()
    if (p.hasProperty('project_radio_jar')) candidates.add(p.file(p.property('project_radio_jar')))
    [ new java.io.File(p.projectDir, 'libs').absolutePath,
      p.projectDir.absolutePath,
      "${home}/.minecraft/mods",
      "${home}/AppData/Roaming/.minecraft/mods",
      "${home}/Downloads" ].each { String dir ->
        def d = new java.io.File(dir)
        if (!d.isDirectory()) return
        def kids = d.listFiles()
        if (kids == null) return
        kids.each { java.io.File f ->
            if (f.isFile()
                    && f.name.toLowerCase().endsWith('.jar')
                    && f.name.toLowerCase().contains('project_radio')) candidates.add(f)
        }
    }
    def report = []
    java.io.File found = null
    candidates.each { java.io.File f ->
        boolean ok = jarHasClass(f, marker)
        report.add(String.format('  %-8s %s', ok ? 'ok' : 'no class', f.absolutePath))
        if (found == null && ok) found = f
    }
    if (found == null) {
        throw new GradleException(
            "Could not find the Project Radio jar to compile against.\n" +
            "Checked (looking for ${marker}):\n" +
            (report.isEmpty() ? '  (no project_radio*.jar found in any searched folder)' : report.join('\n')) + "\n\n" +
            "Fix: drop the Project Radio jar into this project's libs/ folder, or run\n" +
            "     gradlew build -Pproject_radio_jar=C:/path/to/project_radio-1.5.jar")
    }
    return found
}

def prJar = findProjectRadioJar(project, PR_MARKER)
logger.lifecycle("radiogate: compiling against ${prJar.absolutePath}")

dependencies {
    compileOnly files(prJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '500'
}

def modProps = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                neo_version: neo_version, neo_version_range: neo_version_range,
                loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                mod_description: mod_description, project_radio_version_range: project_radio_version_range]

// src/main/templates/META-INF/neoforge.mods.toml has ${placeholders} filled from gradle.properties.
tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties modProps
    expand modProps
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(Jar).configureEach { manifest { attributes(['Implementation-Version': project.version]) } }
